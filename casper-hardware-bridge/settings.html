<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casper Hardware Bridge Settings</title>
    <style>
        :root {
            --bg: #0A0A0A;
            --surface: #171717;
            --border: #262626;
            --textPrimary: #FAFAFA;
            --textSecondary: #A3A3A3;
            --primary: #3B82F6;
            --primaryHover: #2563EB;
            --success: #10B981;
            --danger: #EF4444;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--textPrimary);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            border-radius: 16px;
            border: 1px solid var(--border);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            -webkit-app-region: drag;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
        }

        .title-bar span {
            font-size: 13px;
            font-weight: 600;
            color: var(--textSecondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .close-btn {
            -webkit-app-region: no-drag;
            background: transparent;
            border: none;
            color: var(--textSecondary);
            font-size: 18px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background-color: var(--danger);
            color: white;
        }

        .content {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            color: var(--textSecondary);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .form-group {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            transition: border-color 0.2s ease;
        }
        
        .form-group:focus-within {
            border-color: var(--primary);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--textSecondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--textPrimary);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        select option {
            background-color: var(--surface);
            color: var(--textPrimary);
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary);
        }

        .range-value {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            min-width: 3ch;
            text-align: right;
            color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primaryHover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--surface);
            color: var(--textPrimary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: #262626;
        }

        #statusText {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #statusText.show {
            opacity: 1;
        }
        
        .success { color: var(--success); }
        .error { color: var(--danger); }
    </style>
</head>
<body>

    <div class="title-bar">
        <span>Hardware Bridge</span>
        <button id="btnClose" class="close-btn">&times;</button>
    </div>

    <div class="content">
        <h2>Bridge Settings</h2>
        <p class="subtitle">Hardware ESC/POS Interfacing</p>

        <div class="form-group">
            <label for="printerType">Printer Type Ecosystem</label>
            <select id="printerType">
                <option value="EPSON">Epson / Compatible (Most Common)</option>
                <option value="STAR">Star</option>
                <option value="BROTHER">Brother</option>
            </select>
        </div>

        <div class="form-group">
            <label for="receiptPrinter">Receipt Printer</label>
            <select id="receiptPrinter" class="printer-select">
                <option value="auto">Auto (Default)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="barcodePrinter">Barcode Printer</label>
            <select id="barcodePrinter" class="printer-select">
                <option value="auto">Auto (Default)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="a4Printer">A4 Invoice Printer</label>
            <select id="a4Printer" class="printer-select">
                <option value="auto">Auto (Default)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Top Margin (Lines)</label>
            <div class="range-container">
                <input type="range" id="marginTop" min="0" max="15" value="0">
                <span class="range-value" id="marginTopVal">0</span>
            </div>
        </div>

        <div class="form-group">
            <label>Left Margin (Dots)</label>
            <div class="range-container">
                <input type="range" id="marginLeft" min="0" max="100" value="0">
                <span class="range-value" id="marginLeftVal">0</span>
            </div>
        </div>

        <div class="actions">
            <button id="btnTest" class="btn-secondary">Test Alignment</button>
            <button id="btnSave" class="btn-primary">Save Changes</button>
        </div>
        
        <div id="statusText"></div>
    </div>

    <script src="settings.js"></script>
</body>
</html>

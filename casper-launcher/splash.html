<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casper POS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 340px; height: 300px;
    background: transparent;
    font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }

  .card {
    width: 100%; height: 100%;
    background: linear-gradient(145deg, #0f1117 0%, #161b27 60%, #0c1020 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(99,179,237,0.06);
    padding: 28px 24px 22px;
  }

  /* Logo */
  .logo-wrap {
    width: 72px; height: 72px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(99,179,237,0.12), rgba(129,140,248,0.08));
    border: 1px solid rgba(99,179,237,0.2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    box-shadow: 0 0 28px rgba(99,179,237,0.15);
  }
  .logo-wrap img { width: 44px; height: 44px; object-fit: contain; }

  .brand {
    font-size: 15px; font-weight: 800;
    color: #e2e8f0;
    letter-spacing: 0.04em;
    margin-bottom: 20px;
  }

  /* Status area */
  #status-area {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 100%;
  }

  .status-icon { font-size: 22px; }

  #status-text {
    font-size: 12.5px; font-weight: 600;
    color: #94a3b8;
    text-align: center;
    line-height: 1.5;
    min-height: 36px;
    transition: all 0.3s ease;
  }

  /* Progress bar */
  #progress-wrap {
    width: 100%; height: 3px;
    background: rgba(255,255,255,0.05);
    border-radius: 99px;
    overflow: hidden;
    display: none;
    margin-top: 4px;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    border-radius: 99px;
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Success state */
  .success-text { color: #34d399 !important; }
  .success-icon { filter: drop-shadow(0 0 8px rgba(52,211,153,0.6)); }

  /* Error state */
  .error-text { color: #f87171 !important; }

  /* Pulse animation for searching */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .pulsing { animation: pulse 1.8s ease-in-out infinite; }

  /* Skip link */
  #skip-link {
    display: none;
    margin-top: 6px;
    font-size: 10.5px;
    color: #475569;
    cursor: pointer;
    text-decoration: underline;
    -webkit-app-region: no-drag;
  }
  #skip-link:hover { color: #94a3b8; }

  /* Manual entry form */
  #manual-form {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-top: 4px;
  }
  #manual-form input {
    width: 100%;
    padding: 9px 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    outline: none;
    text-align: center;
    -webkit-app-region: no-drag;
    transition: border-color 0.2s;
  }
  #manual-form input:focus { border-color: rgba(99,179,237,0.5); }
  #manual-form button {
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: opacity 0.2s;
  }
  #manual-form button:hover { opacity: 0.88; }
  #manual-form button:disabled { opacity: 0.45; cursor: not-allowed; }
  #manual-error {
    font-size: 11px;
    color: #f87171;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img id="logo" src="./assets/casper-light.png" alt="Casper" onerror="this.style.display='none'">
  </div>
  <div class="brand">Casper POS</div>

  <div id="status-area">
    <div class="status-icon" id="status-icon">🔍</div>
    <div id="status-text" class="pulsing">جاري الاتصال بالكاشير الرئيسي...</div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="skip-link" onclick="showManual()">اتصال يدوي</div>
  </div>

  <div id="manual-form">
    <input id="ip-input" type="text" placeholder="192.168.1.X" autocomplete="off" spellcheck="false">
    <button id="connect-btn" onclick="connectManual()">اتصال</button>
    <div id="manual-error"></div>
    <div id="skip-link" style="display:block" onclick="retryAuto()">🔄 إعادة البحث التلقائي</div>
  </div>
</div>

<script>
  // ── Logo path: try packaged resources first, fallback to dev relative path ──
  const logoEl = document.getElementById('logo');
  const resourcesPath = window.process?.resourcesPath;
  if (resourcesPath) {
    logoEl.src = `file://${resourcesPath}/assets/casper-light.png`;
  }

  let skipVisible = false;
  let skipTimer = null;

  function showSkipAfterDelay() {
    if (!skipTimer) {
      skipTimer = setTimeout(() => {
        const sk = document.getElementById('skip-link');
        if (sk) { sk.style.display = 'block'; skipVisible = true; }
      }, 3000);
    }
  }

  function setStatus(icon, text, cls = '') {
    document.getElementById('status-icon').textContent = icon;
    const t = document.getElementById('status-text');
    t.textContent = text;
    t.className = cls ? cls : 'pulsing';
    showSkipAfterDelay();
  }

  function setProgress(pct) {
    const wrap = document.getElementById('progress-wrap');
    const bar = document.getElementById('progress-bar');
    wrap.style.display = 'block';
    bar.style.width = pct + '%';
  }

  function showManual(lastIp = '', lastPort = 3001) {
    clearTimeout(skipTimer);
    document.getElementById('status-area').style.display = 'none';
    const form = document.getElementById('manual-form');
    form.style.display = 'flex';
    const input = document.getElementById('ip-input');
    if (lastIp) input.value = lastIp + ':' + lastPort;
    input.focus();
    input.select();
  }

  function retryAuto() {
    document.getElementById('manual-form').style.display = 'none';
    document.getElementById('status-area').style.display = 'flex';
    skipTimer = null; skipVisible = false;
    window.launcher.retryDiscovery();
  }

  async function connectManual() {
    const raw = document.getElementById('ip-input').value.trim();
    const btn = document.getElementById('connect-btn');
    const errEl = document.getElementById('manual-error');

    // Accept "192.168.1.5" or "192.168.1.5:3001"
    const [ip, port] = raw.includes(':') ? raw.split(':') : [raw, '3001'];
    if (!ip) return;

    btn.disabled = true;
    btn.textContent = 'جاري الاتصال...';
    errEl.style.display = 'none';

    const result = await window.launcher.connectManual(ip.trim(), parseInt(port) || 3001);
    if (!result.success) {
      errEl.textContent = result.error || 'فشل الاتصال';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'اتصال';
    }
    // On success, main.js shows 'opening' status then quits
  }

  // Handle Enter key in manual form
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('ip-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connectManual();
    });
  });

  // ── Status events from main process ──────────────────────────────────────
  window.launcher.onStatus((data) => {
    const progressWrap = document.getElementById('progress-wrap');

    switch (data.status) {
      case 'checking_cache':
        setStatus('⚡', 'جاري التحقق من آخر اتصال...');
        break;
      case 'udp_scan':
        setStatus('📡', 'جاري مسح الشبكة المحلية...');
        progressWrap.style.display = 'none';
        break;
      case 'subnet_scan':
        setStatus('🌐', `جاري البحث في الشبكة... ${data.progress || 0}%`);
        setProgress(data.progress || 0);
        break;
      case 'mdns':
        setStatus('🔗', 'جاري التحقق من اسم الشبكة...');
        progressWrap.style.display = 'none';
        break;
      case 'manual':
        showManual(data.lastIp, data.lastPort);
        break;
      case 'opening':
        clearTimeout(skipTimer);
        document.getElementById('manual-form').style.display = 'none';
        document.getElementById('status-area').style.display = 'flex';
        progressWrap.style.display = 'none';
        const sk = document.getElementById('skip-link');
        if (sk) sk.style.display = 'none';
        setStatus('✅', 'تم فتح الكاشير في المتصفح ✓', 'success-text');
        break;
    }
  });
</script>
</body>
</html>
